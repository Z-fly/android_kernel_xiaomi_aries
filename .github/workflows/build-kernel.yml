name: Build Aries KernelSU kernel

on:
  workflow_dispatch:
    inputs:
      kernelsu_ref:
        description: Optional KernelSU branch, tag, or commit; blank uses the pinned submodule
        required: false
        default: ""
      anykernel_ref:
        description: AnyKernel3 branch, tag, or commit
        required: false
        default: master
      make_jobs:
        description: Parallel build jobs (use 1 if this legacy tree races)
        required: true
        default: "1"
      extra_make_args:
        description: Extra make arguments
        required: false
        default: ""

permissions:
  contents: read

env:
  ARCH: arm
  SUBARCH: arm
  OUT_DIR: out

  TOOLCHAIN_REPOSITORY: https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.8
  TOOLCHAIN_REF: android-5.1.1_r38
  TOOLCHAIN_DIR: /opt/toolchain/arm-linux-androideabi-4.8
  TOOLCHAIN_PREFIX: /opt/toolchain/arm-linux-androideabi-4.8/bin/arm-linux-androideabi-

  # kernel version
  KERNEL_RELEASE: 3.4.113-perf-KernelSU-0818
  KERNEL_LOCALVERSION: -perf-KernelSU-0818

  # build information
  TZ: Asia/Shanghai
  KBUILD_BUILD_TIMESTAMP: "Tue Aug 18 18:18:18 CST 2026"
  KBUILD_BUILD_VERSION: "1"

  CCACHE_DIR: ${{ github.workspace }}/.ccache
  ANYKERNEL3_REPOSITORY: https://github.com/osm0sis/AnyKernel3.git
  EXTRA_MAKE_ARGS: ${{ inputs.extra_make_args }}

jobs:
  build:
    name: Build aries-perf-user_defconfig
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex git libssl-dev python3 zip
      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-aries-aosp-gcc-4.8-${{ hashFiles('arch/arm/configs/aries-perf-user_defconfig', '.gitmodules', '.github/workflows/build-kernel.yml') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-aries-aosp-gcc-4.8-
            ccache-${{ runner.os }}-aries-aosp-gcc-4.8-
      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size=5G
          ccache --set-config=compiler_check=content
          ccache --zero-stats
      - name: Checkout AOSP GCC 4.8
        run: |
          sudo install -d -o "$USER" -g "$(id -gn)" /opt/toolchain
          git clone --depth=1 --branch "$TOOLCHAIN_REF" --single-branch "$TOOLCHAIN_REPOSITORY" "$TOOLCHAIN_DIR"
          test -x "${TOOLCHAIN_PREFIX}gcc"
          echo "Toolchain:"
          "${TOOLCHAIN_PREFIX}gcc" --version
      - name: Prepare KernelSU
        env:
          KERNELSU_REF: ${{ inputs.kernelsu_ref }}
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive KernelSU
          if [ -n "$KERNELSU_REF" ]; then
            git -C KernelSU fetch --force --tags origin "$KERNELSU_REF"
            git -C KernelSU checkout --detach FETCH_HEAD
          fi
          test "$(git config -f .gitmodules --get submodule.KernelSU.url)" = "https://github.com/backslashxx/KernelSU.git"
          test -f KernelSU/kernel/Kconfig
          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"
          git -C KernelSU rev-parse HEAD
      - name: Configure kernel
        run: |
          mkdir -p "$OUT_DIR"
          EXTRA_ARGS=()
          if [ -n "$EXTRA_MAKE_ARGS" ]; then
            read -r -a EXTRA_ARGS <<< "$EXTRA_MAKE_ARGS"
          fi
          MAKE_ARGS=(
            O="$OUT_DIR"
            ARCH="$ARCH"
            SUBARCH="$SUBARCH"
            CROSS_COMPILE="$TOOLCHAIN_PREFIX"
            CC="ccache ${TOOLCHAIN_PREFIX}gcc"
            HOSTCFLAGS="-fcommon"
            LOCALVERSION=""
          )
          make "${MAKE_ARGS[@]}" "${EXTRA_ARGS[@]}" aries-perf-user_defconfig
          scripts/config --file "$OUT_DIR/.config" --set-str LOCALVERSION "$KERNEL_LOCALVERSION" --disable LOCALVERSION_AUTO
          make "${MAKE_ARGS[@]}" "${EXTRA_ARGS[@]}" silentoldconfig
          grep -qx 'CONFIG_KSU=y' "$OUT_DIR/.config"
          grep -qx 'CONFIG_KSU_LSM_SECURITY_HOOKS=y' "$OUT_DIR/.config"
          make -s "${MAKE_ARGS[@]}" "${EXTRA_ARGS[@]}" kernelrelease
      - name: Build kernel
        env:
          JOBS: ${{ inputs.make_jobs }}
        run: |
          case "$JOBS" in
            ''|*[!0-9]*)
              echo "make_jobs must be a positive integer" >&2
              exit 1
              ;;
          esac
          if [ "$JOBS" -lt 1 ]; then
            echo "make_jobs must be at least 1" >&2
            exit 1
          fi
          EXTRA_ARGS=()
          if [ -n "$EXTRA_MAKE_ARGS" ]; then
            read -r -a EXTRA_ARGS <<< "$EXTRA_MAKE_ARGS"
          fi
          MAKE_ARGS=(
            O="$OUT_DIR"
            ARCH="$ARCH"
            SUBARCH="$SUBARCH"
            CROSS_COMPILE="$TOOLCHAIN_PREFIX"
            CC="ccache ${TOOLCHAIN_PREFIX}gcc"
            HOSTCFLAGS="-fcommon"
            LOCALVERSION=""
          )
          make -j"$JOBS" "${MAKE_ARGS[@]}" "${EXTRA_ARGS[@]}"
      - name: Package AnyKernel3 flashable zip
        env:
          ANYKERNEL_REF: ${{ inputs.anykernel_ref }}
        run: |
          IMAGE_PATH="$OUT_DIR/arch/arm/boot/zImage"
          test -s "$IMAGE_PATH"
          git clone --depth=1 "$ANYKERNEL3_REPOSITORY" AnyKernel3
          if [ -n "$ANYKERNEL_REF" ]; then
            git -C AnyKernel3 fetch --depth=1 origin "$ANYKERNEL_REF"
            git -C AnyKernel3 checkout --detach FETCH_HEAD
          fi
          rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/README.md
          cp "$IMAGE_PATH" AnyKernel3/zImage
          cat > AnyKernel3/anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ### Xiaomi Mi 2/2S (aries) KernelSU kernel
          properties() { '
          kernel.string=Xiaomi Mi 2/2S (aries) KernelSU kernel
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=aries
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          BLOCK=boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF
          mkdir -p artifacts
          ZIP_NAME="AnyKernel3-KernelSU-aries-${{ github.run_number }}.zip"
          (
            cd AnyKernel3
            zip -r9 "$GITHUB_WORKSPACE/artifacts/$ZIP_NAME" . -x '*.git*' 'README.md'
          )
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aries-kernelsu-${{ github.run_number }}
          path: artifacts/AnyKernel3-KernelSU-aries-${{ github.run_number }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
