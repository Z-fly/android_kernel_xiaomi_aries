name: Build Aries kernel

on:
  workflow_dispatch:
    inputs:
      extra_make_args:
        description: Extra make arguments
        required: false
        default: ""

permissions:
  contents: read

env:
  ARCH: arm
  SUBARCH: arm
  MAKE_JOBS: "4"
  TOOLCHAIN_URL: https://developer.arm.com/-/cdn-downloads/permalink/legacy-linaro-gnu-toolchains/7.5-2019.12/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz
  TOOLCHAIN_DIR: /opt/toolchain/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi
  TOOLCHAIN_PREFIX: /opt/toolchain/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi/bin/arm-linux-gnueabi-
  KERNEL_RELEASE: 3.4.113-perf-KernelSU-0818
  KERNEL_LOCALVERSION: -perf-KernelSU-0818
  TZ: Asia/Shanghai
  KBUILD_BUILD_TIMESTAMP: "Tue Aug 18 18:18:18 CST 2026"
  KBUILD_BUILD_VERSION: "1"
  EXTRA_MAKE_ARGS: ${{ inputs.extra_make_args }}

jobs:
  build:
    name: Build aries-perf-user_defconfig
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set build directories
        run: |
          echo "OUT_DIR=$RUNNER_TEMP/aries-out" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=$RUNNER_TEMP/aries-artifacts" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/aries-ccache" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev python3 xz-utils

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-aries-linaro-gcc-7.5-${{ hashFiles('arch/arm/configs/aries-perf-user_defconfig', '.github/workflows/build-kernel.yml') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-aries-linaro-gcc-7.5-
            ccache-${{ runner.os }}-aries-linaro-gcc-7.5-

      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size=5G
          ccache --set-config=compiler_check=content
          ccache --zero-stats

      - name: Install Linaro GCC 7.5
        run: |
          sudo install -d -o "$USER" -g "$(id -gn)" /opt/toolchain
          curl --fail --location --retry 3 "$TOOLCHAIN_URL" -o /tmp/linaro-toolchain.tar.xz
          tar -xJf /tmp/linaro-toolchain.tar.xz -C /opt/toolchain
          test -x "${TOOLCHAIN_PREFIX}gcc"
          "${TOOLCHAIN_PREFIX}gcc" --version

      - name: Configure kernel
        run: |
          mkdir -p "$OUT_DIR"
          EXTRA_ARGS=()
          if [ -n "$EXTRA_MAKE_ARGS" ]; then
            read -r -a EXTRA_ARGS <<< "$EXTRA_MAKE_ARGS"
          fi
          MAKE_ARGS=(
            O="$OUT_DIR"
            ARCH="$ARCH"
            SUBARCH="$SUBARCH"
            CROSS_COMPILE="$TOOLCHAIN_PREFIX"
            CC="ccache ${TOOLCHAIN_PREFIX}gcc"
            HOSTCFLAGS="-fcommon"
            # KernelSU uses modern C; Linux 3.4 headers require GNU89 inline semantics.
            KCFLAGS="-fgnu89-inline"
            LOCALVERSION=""
          )
          make "${MAKE_ARGS[@]}" "${EXTRA_ARGS[@]}" aries-perf-user_defconfig
          scripts/config --file "$OUT_DIR/.config" --set-str LOCALVERSION "$KERNEL_LOCALVERSION" --disable LOCALVERSION_AUTO
          make "${MAKE_ARGS[@]}" "${EXTRA_ARGS[@]}" silentoldconfig
          grep -qx 'CONFIG_KSU=y' "$OUT_DIR/.config"
          grep -qx 'CONFIG_KSU_TAMPER_SYSCALL_TABLE=y' "$OUT_DIR/.config"
          test "$(make -s "${MAKE_ARGS[@]}" "${EXTRA_ARGS[@]}" kernelrelease)" = "$KERNEL_RELEASE"

      - name: Build kernel
        run: |
          EXTRA_ARGS=()
          if [ -n "$EXTRA_MAKE_ARGS" ]; then
            read -r -a EXTRA_ARGS <<< "$EXTRA_MAKE_ARGS"
          fi
          MAKE_ARGS=(
            O="$OUT_DIR"
            ARCH="$ARCH"
            SUBARCH="$SUBARCH"
            CROSS_COMPILE="$TOOLCHAIN_PREFIX"
            CC="ccache ${TOOLCHAIN_PREFIX}gcc"
            HOSTCFLAGS="-fcommon"
            # KernelSU uses modern C; Linux 3.4 headers require GNU89 inline semantics.
            KCFLAGS="-fgnu89-inline"
            LOCALVERSION=""
          )
          make "${MAKE_ARGS[@]}" "${EXTRA_ARGS[@]}" -j"$MAKE_JOBS"

      - name: Replace zImage in boot image
        run: |
          IMAGE_PATH="$OUT_DIR/arch/arm/boot/zImage"
          BOOT_IMAGE="$ARTIFACT_DIR/boot-aries-kernelsu-${KERNEL_RELEASE}-${GITHUB_RUN_NUMBER}.img"
          test -s "$IMAGE_PATH"
          python3 - ".github/workflows/boot.img" "$IMAGE_PATH" "$BOOT_IMAGE" <<'PY'
          from hashlib import sha1, sha256
          from pathlib import Path
          from struct import unpack_from, pack_into, pack
          from sys import argv

          模板路径, 内核路径, 输出路径 = map(Path, argv[1:])
          启动镜像 = 模板路径.read_bytes()
          内核镜像 = 内核路径.read_bytes()
          if len(启动镜像) < 608 or 启动镜像[:8] != b"ANDROID!":
              raise SystemExit(f"无效的Android boot镜像: {模板路径}")
          if len(内核镜像) < 0x28 or unpack_from("<I", 内核镜像, 0x24)[0] != 0x016F2818:
              raise SystemExit(f"无效的ARM zImage: {内核路径}")
          读取整数 = lambda 偏移: unpack_from("<I", 启动镜像, 偏移)[0]
          旧内核大小, 内存盘大小, 第二阶段大小, 页面大小, 设备树大小 = map(
              读取整数, (8, 16, 24, 36, 40)
          )
          if 页面大小 < 608 or 页面大小 & (页面大小 - 1):
              raise SystemExit(f"无效的页面大小: {页面大小}")
          对齐大小 = lambda 大小: (大小 + 页面大小 - 1) // 页面大小 * 页面大小
          偏移 = 页面大小 + 对齐大小(旧内核大小)
          内存盘 = 启动镜像[偏移:偏移 + 内存盘大小]
          偏移 += 对齐大小(内存盘大小)
          第二阶段 = 启动镜像[偏移:偏移 + 第二阶段大小]
          偏移 += 对齐大小(第二阶段大小)
          设备树 = 启动镜像[偏移:偏移 + 设备树大小]
          if (len(内存盘) != 内存盘大小 or len(第二阶段) != 第二阶段大小
                  or len(设备树) != 设备树大小
                  or 偏移 + 对齐大小(设备树大小) != len(启动镜像)):
              raise SystemExit("不支持的旧版boot镜像布局")
          # Legacy mkbootimg variants differ on hashing an empty DT segment.
          # Preserve the convention used by this template.
          旧内核 = 启动镜像[页面大小:页面大小 + 旧内核大小]
          def 计算摘要(数据段列表):
              摘要 = sha1()
              for 数据段 in 数据段列表:
                  摘要.update(数据段)
                  摘要.update(pack("<I", len(数据段)))
              return 摘要
          包含设备树摘要 = None
          for 包含设备树 in (True, False):
              if 设备树大小 and not 包含设备树:
                  continue
              数据段列表 = (旧内核, 内存盘, 第二阶段, 设备树) if 包含设备树 else (旧内核, 内存盘, 第二阶段)
              if 计算摘要(数据段列表).digest() == 启动镜像[576:596]:
                  包含设备树摘要 = 包含设备树
                  break
          if 包含设备树摘要 is None:
              raise SystemExit("原boot镜像的SHA-1校验不匹配")
          文件头 = bytearray(启动镜像[:页面大小])
          pack_into("<I", 文件头, 8, len(内核镜像))
          数据段列表 = (内核镜像, 内存盘, 第二阶段, 设备树) if 包含设备树摘要 else (内核镜像, 内存盘, 第二阶段)
          摘要 = 计算摘要(数据段列表)
          文件头[576:608] = 摘要.digest() + bytes(12)
          补齐 = lambda 数据段: 数据段 + bytes(对齐大小(len(数据段)) - len(数据段))
          新启动镜像 = bytes(文件头) + b"".join(map(补齐, (内核镜像, 内存盘, 第二阶段, 设备树)))
          输出路径.parent.mkdir(parents=True, exist_ok=True)
          输出路径.write_bytes(新启动镜像)
          print(f"已生成 {输出路径} ({len(新启动镜像)} bytes)")
          print(f"SHA-256: {sha256(新启动镜像).hexdigest()}")
          PY
          test -s "$BOOT_IMAGE"
          echo "BOOT_IMAGE=$BOOT_IMAGE" >> "$GITHUB_ENV"

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aries-${{ github.run_number }}
          path: ${{ env.BOOT_IMAGE }}
          archive: false
          if-no-files-found: error
          retention-days: 30
